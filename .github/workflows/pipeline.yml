# Pipeline unique : on publie EXACTEMENT ce qui vient d'être vérifié, et rien d'autre.
#
#   pull_request ──► Vérification complète ──► Porte de publication (preuve, ne publie rien)
#   push main    ──► Vérification complète ──► GitHub Pages (démonstration)
#                                          └─► Cloudflare Pages (production isolée, environnement protégé)
#
# Garanties :
#  - les jobs de publication dépendent (needs) de « Vérification complète » : si elle échoue,
#    ils sont ignorés ;
#  - ils publient leur artefact construit et vérifié dans CE run (même commit), jamais un nouveau build ;
#    démo sans Google et profil isolé sont deux artefacts explicites ;
#  - aucun déclenchement manuel (pas de workflow_dispatch) ;
#  - publication uniquement depuis un push sur main ;
#  - Cloudflare : projet en « Direct Upload » (aucune construction parallèle par Cloudflare),
#    jeton stocké dans l'environnement GitHub « production », réservé à main et soumis à approbation.
#
# Toute modification de ce fichier est une modification de sécurité : revue humaine obligatoire.

name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fortress-test-bundle:
    name: FORTRESS TEST - isolated public config bundle
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/fortress-drive-execution-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - id: fortress
        name: Build and attest Google-enabled fake-only TEST
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          FORTRESS_TEST_GOOGLE_CONFIG: ${{ vars.FORTRESS_TEST_GOOGLE_CONFIG }}
          GOOGLE_DRIVE_CONFIG: ${{ vars.FORTRESS_TEST_GOOGLE_CONFIG }}
        run: |
          node scripts/build-drive-test.mjs > "$RUNNER_TEMP/fortress-build-receipt.json"
          node scripts/verify-fortress-artifact.mjs "$RUNNER_TEMP/fortress-build-receipt.json"
      - name: Archive attested synthetic TEST only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fortress-control-vault-test-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.fortress.outputs.site_dir }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: drive-test-javascript

  verify:
    name: Vérification complète
    needs: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Même version que package-lock.json : navigateurs et bibliothèques déjà présents.
    # Évite l'installation apt des dépendances navigateur pendant chaque validation.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — SHA vérifié le 23/10/2026
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 — SHA vérifié le 23/10/2026
        with:
          node-version: 22
          cache: npm
      - name: Installation (verrouillée)
        run: npm ci
      - name: Audit de toutes les dépendances (production et développement)
        run: npm audit --audit-level=moderate
      - name: TypeScript
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npm run build
      # Deux profils explicites : aucune configuration Google dans la démo.
      # Les DEUX artefacts sont construits et vérifiés avant leur publication.
      - name: Build de l'origine isolée (configuration publique)
        run: npm run build
        env:
          VAULT_OUT: dist-cloudflare
          VAULT_DEDICATED_BUILD: '1'
          GOOGLE_DRIVE_CONFIG: ${{ vars.GOOGLE_DRIVE_CONFIG }}
      - name: Contrôle de sécurité (secrets, source maps, identifiants, CSP, en-têtes)
        run: |
          node scripts/security-check.ts dist
          node scripts/security-check.ts dist-cloudflare
      - name: Navigateurs Playwright préinstallés
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import { access } from 'node:fs/promises';
          import { constants } from 'node:fs';
          import { chromium, webkit } from '@playwright/test';
          for (const browser of [chromium, webkit]) {
            await access(browser.executablePath(), constants.X_OK);
            console.log(`Navigateur ${browser.name()} présent dans l'image.`);
          }
          NODE
      - name: Parcours, sécurité et accessibilité (Chromium + WebKit)
        run: npm run test:e2e
        env:
          CI: '1'
      - name: Captures d'écran des parcours (données fictives uniquement)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — SHA vérifié le 23/10/2026
        with:
          name: captures-parcours
          path: screenshots/
          retention-days: 30
      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — SHA vérifié le 23/10/2026
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 14
      # L'artefact publié est celui-ci : construit puis testé ci-dessus, pour ce commit.
      - name: Artefact vérifié (Cloudflare)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — SHA vérifié le 23/10/2026
        with:
          name: site-verifie-${{ github.sha }}
          path: dist-cloudflare/
          include-hidden-files: true
          retention-days: 7
      # Même archive Linux que upload-pages-artifact v3, sans son appel
      # transitif mobile à upload-artifact@v4. Les octets de dist/ restent ceux testés.
      - name: Archive vérifiée (GitHub Pages)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar --dereference --hard-dereference -C dist --exclude=.git --exclude=.github -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Artefact vérifié (GitHub Pages)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — SHA vérifié le 23/10/2026
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  gate:
    name: Porte de publication
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Preuve
        run: |
          echo "Vérification complète réussie pour ${{ github.event.pull_request.head.sha }}."
          echo "Ce job n'existe que si la vérification a réussi : une vérification échouée le laisse « skipped »."

  deploy-pages:
    name: Publication GitHub Pages (démonstration)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: production-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 — SHA vérifié le 23/10/2026
      - name: Le site sert bien ce commit
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            served=$(curl -fsS "${url}version.json" | sed -E 's/.*"sha":"([0-9a-f]+)".*/\1/' || true)
            [ "$served" = "${{ github.sha }}" ] && echo "Commit servi : $served" && exit 0
            sleep 10
          done
          echo "Le site ne sert pas ${{ github.sha }} (reçu : ${served:-rien})." && exit 1

  deploy-cloudflare:
    name: Publication Cloudflare Pages (production isolée)
    needs: verify
    # Inactif tant que le projet Cloudflare n'est pas déclaré (variable de dépôt CLOUDFLARE_PROJECT).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT != ''
    runs-on: ubuntu-latest
    # Environnement protégé : branche main uniquement + approbation humaine (voir docs/DEPLOYMENT.md).
    environment:
      name: production
      url: https://${{ vars.CLOUDFLARE_PROJECT }}.pages.dev
    concurrency:
      group: production-cloudflare
      cancel-in-progress: false
    steps:
      - name: Récupération de l'artefact vérifié de ce run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 — SHA vérifié le 23/10/2026
        with:
          name: site-verifie-${{ github.sha }}
          path: dist
      - name: L'artefact correspond au commit
        run: grep -q "\"sha\":\"${{ github.sha }}\"" dist/version.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 — SHA vérifié le 23/10/2026
        with:
          node-version: 22
      - name: Projet Cloudflare en envoi direct (créé une seule fois, sans connexion Git)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4.137.0 pages project list 2>/dev/null | grep -qw "${{ vars.CLOUDFLARE_PROJECT }}"; then
            echo "Projet existant."
          else
            npx --yes wrangler@4.137.0 pages project create "${{ vars.CLOUDFLARE_PROJECT }}" --production-branch main
          fi
      - name: Envoi direct vers Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.137.0 pages deploy dist --project-name "${{ vars.CLOUDFLARE_PROJECT }}" --branch main --commit-hash "${{ github.sha }}" --commit-dirty=false
      - name: Production servie, commit exact, en-têtes de sécurité
        run: |
          url="https://${{ vars.CLOUDFLARE_PROJECT }}.pages.dev"
          for i in 1 2 3 4 5 6; do
            served=$(curl -fsS "$url/version.json" | sed -E 's/.*"sha":"([0-9a-f]+)".*/\1/' || true)
            [ "$served" = "${{ github.sha }}" ] && break
            sleep 10
          done
          [ "$served" = "${{ github.sha }}" ] || { echo "Production ne sert pas ${{ github.sha }}"; exit 1; }
          for f in index.html drive-config.json; do
            p="$f"; [ "$f" = index.html ] && p=""
            [ "$(curl -fsS "$url/$p" | sha256sum | cut -d' ' -f1)" = "$(sha256sum "dist/$f" | cut -d' ' -f1)" ] || { echo "Octets servis différents : $f"; exit 1; }
          done
          headers=$(curl -fsSI "$url/")
          for h in "content-security-policy: .*frame-ancestors 'none'" "x-frame-options: DENY" "x-content-type-options: nosniff" "referrer-policy: strict-origin-when-cross-origin" "strict-transport-security:"; do
            echo "$headers" | grep -qi "$h" || { echo "En-tête manquant : $h"; exit 1; }
          done
          echo "Production vérifiée : $served, en-têtes de sécurité présents."
