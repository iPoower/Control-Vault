name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Types, tests, build, parcours Chromium + WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npm run build
      - name: Aucun secret dans le build
        run: |
          ! grep -rEi "(api[_-]?key|secret|password|BEGIN (RSA|EC|PRIVATE)|ya29\.|sk_live|service_role)" dist/ || (echo "Motif sensible détecté dans dist/" && exit 1)
      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Parcours et accessibilité (Chromium + WebKit)
        run: npm run test:e2e
        env:
          CI: '1'
      - name: Captures d'écran des parcours
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-parcours
          path: screenshots/
          retention-days: 30
      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 14
